[project]
name = "errand-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned, not floating. `messages.reply` takes the body as flattened keyword
    # args in 0.5.8 and a required positional ReplyToMessageRequest in the
    # current published reference, so `>=` would let a routine resolve break the
    # merchant reply path with a TypeError. See app/brokers/mail.py reply().
    "agentmail==0.5.8",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.30",
    "bcrypt>=4.1",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "openai>=2.52.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.9",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]
